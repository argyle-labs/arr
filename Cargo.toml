# `arr` is a Cargo WORKSPACE that builds one dynamic (subprocess) orca plugin per
# *arr application. Each app under `crates/` is a `[[bin]]` orca spawns and talks
# to over the orca socket; they all sit on the shared `arr-base` crate (the
# Servarr transport + progenitor codegen), so the ~590-line base stays DRY across
# every flavor.
#
# Adding an *arr app: drop its `specs/<app>.openapi.json` into `arr-base`, add a
# `flavor!(<app>)` + `Flavor` variant there, then add a `crates/<app>` plugin
# crate that depends on `arr-base` and exposes its own single-namespace tools.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Also the org-index description read by `labs profile` (this repo is a workspace,
# not a single package, so its index metadata lives at the workspace level).
description = "The *arr stack — Sonarr, Radarr, Prowlarr, Lidarr, Readarr as individual orca plugins"

# Org-index category for `labs profile`. A workspace has no [package], so the
# generator reads [workspace.metadata.orca] here instead of [package.metadata.orca].
[workspace.metadata.orca]
category = "downloads"
# This repo ships FIVE independent plugin binaries (one per *arr app), not a single
# bundled `arr` plugin. Each is its own catalog entry / release artifact
# (`{name}-v{version}-{triple}`). Keep in sync with the crates under `crates/`.
plugins = ["lidarr", "prowlarr", "radarr", "readarr", "sonarr"]

[workspace.dependencies]
# The SOLE orca dependency shared by every crate. All macro-emitted paths
# (`#[orca_tool]`, `endpoint_resource!`, dispatch) resolve through
# `::plugin_toolkit::*`; the progenitor-generated clients' bare serde/reqwest
# paths are rewritten to `::plugin_toolkit::*` by the build-time codegen.
plugin-toolkit = { version = "=0.2.1-rc.39", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "openapi", "http"] }
plugin-toolkit-build = { version = "=0.2.1-rc.39", registry = "gitea", package = "orca-plugin-toolkit-build" }
# The shared Servarr base (transport + typed clients).
arr-base = { path = "crates/arr-base" }
# Dev-only (tests): wiremock/tokio/rustls drive the HTTP + auth transport tests.
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
rustls   = "0.23"

# Match orca's workspace lint floor: discarding a Result/Option via `let _ = ...`
# was a load-bearing past incident, so keep it a hard error across every crate —
# each plugin must stay portable back into the orca workspace.
[workspace.lints.clippy]
let_underscore_must_use = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
