# Lidarr - Music Manager
# docs: ../../docs/services/lidarr.md

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:${LIDARR_IMAGE_TAG:-latest}
    container_name: lidarr
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TZ:-America/Denver}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    volumes:
      - ${LIDARR_CONFIG_PATH:-/opt/appdata/lidarr}:/config
      - ${DOWNLOADS_PATH:-/mnt/pool/downloads}:/downloads
      - ${MEDIA_PATH:-/mnt/pool/data/media}:/data/media
    networks:
      - media
    restart: unless-stopped

networks:
  media:
    external: true
