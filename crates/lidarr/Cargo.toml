[package]
name = "lidarr"
version.workspace = true
edition.workspace = true
description = "Lidarr — music automation (orca plugin)"

[package.metadata.orca]
category = "downloads"

[lib]
name = "lidarr"
path = "src/lib.rs"
# rlib retains the in-crate #[cfg(test)] harness. The plugin artifact is the
# [[bin]] below — a subprocess that talks to the orca daemon over its Unix
# socket via serve_tool_plugin! from plugin-toolkit.
crate-type = ["rlib"]

[[bin]]
name = "lidarr"
path = "src/main.rs"

[dependencies]
plugin-toolkit.workspace = true
# Shared Servarr transport + typed clients.
arr-base.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
