[package]
name = "radarr"
version.workspace = true
edition.workspace = true
description = "Radarr — movie automation (orca plugin)"

[package.metadata.orca]
category = "downloads"

[lib]
name = "radarr"
path = "src/lib.rs"
# rlib retains the in-crate #[cfg(test)] harness. The plugin artifact is now the
# [[bin]] below — a dynamic subprocess the loader spawns, not a dlopened cdylib.
crate-type = ["rlib"]

[[bin]]
name = "radarr"
path = "src/main.rs"

[dependencies]
plugin-toolkit.workspace = true
# Shared Servarr transport + typed clients.
arr-base.workspace = true

[dev-dependencies]
plugin-toolkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
