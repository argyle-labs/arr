# Radarr 4K - Separate Radarr Instance for 4K Content
# docs: ../../docs/services/radarr-4k.md

services:
  radarr-4k:
    image: lscr.io/linuxserver/radarr:${RADARR_4K_IMAGE_TAG:-${RADARR_IMAGE_TAG:-latest}}
    container_name: radarr-4k
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TZ:-America/Denver}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "7879:7878"
    volumes:
      - ${RADARR_4K_CONFIG_PATH:-/opt/appdata/radarr-4k}:/config
      - ${DOWNLOADS_PATH:-/mnt/pool/downloads}:/downloads
      - ${MEDIA_PATH:-/mnt/pool/data/media}:/data/media
    networks:
      - media
    restart: unless-stopped

networks:
  media:
    external: true
