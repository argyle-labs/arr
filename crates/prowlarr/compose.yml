# Prowlarr - Indexer Manager
# docs: ../../docs/services/prowlarr.md

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_IMAGE_TAG:-latest}
    container_name: prowlarr
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TZ:-America/Denver}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "9696:9696"
    volumes:
      - ${PROWLARR_CONFIG_PATH:-/opt/appdata/prowlarr}:/config
    networks:
      - media
    restart: unless-stopped

networks:
  media:
    external: true
